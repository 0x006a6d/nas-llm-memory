<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記憶統合 — 設定と中身</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div class="frame">
  <aside class="rail">
    <div class="rail-title">
      <span class="rail-mark"></span>
      <div>
        <div class="rail-name">記憶統合</div>
        <div class="rail-sub">nas-llm-memory</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#overview" data-tab="overview" title="全体の流れと現在の状態">概要</a>
      <a href="#collect" data-tab="collect" title="収集段: 何を集め、何を除外し、バッチが動いているか">収集</a>
      <a href="#facts" data-tab="facts" title="記録: 生ログ(turns)の検索・フラグと、蒸留された事実(facts)の編集">記録 (facts)</a>
      <a href="#shelf" data-tab="shelf" title="書架: 夜間バッチの起案・決裁文書の閲覧と後閲(差し戻し)・専決規程の変更">書架 (決裁)</a>
      <a href="#skills" data-tab="skills" title="蒸留段: 繰り返し作業の手順書(スキル)と使用実績">スキル</a>
      <a href="#hooks" data-tab="hooks" title="蒸留段: 決まった時点で必ず実行される仕込み(フック)">Hooks</a>
      <a href="#context" data-tab="context" title="配布物: セッションに注入される index の中身">コンテキスト</a>
      <a href="#routing" data-tab="routing" title="配布段: どの端末にどのプロジェクトの index を注入するか">配布</a>
      <a href="#messages" data-tab="messages" title="一度きりの申し送り(次セッションで表示されて終わり)">申し送り</a>
      <a href="#usage" data-tab="usage" title="Claude Code の使用量(各端末→OTLP→NAS Prometheus のテレメトリ集計)">使用量</a>
    </nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <main class="stage">
    <header class="topbar">
      <div id="topbarTitle" class="topbar-title"></div>
      <div class="topbar-right">
        <span id="nasStamp" class="stamp"></span>
        <button id="refreshNas" class="btn ghost" title="NASから再取得">NAS更新</button>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
<script src="/static/theme.js"></script>
</body>
</html>
