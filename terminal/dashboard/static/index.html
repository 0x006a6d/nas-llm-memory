<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記憶統合 — 設定と中身</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div class="frame">
  <aside class="rail">
    <div class="rail-title">
      <span class="rail-mark"></span>
      <div>
        <div class="rail-name">記憶統合</div>
        <div class="rail-sub">nas-llm-memory</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#overview" data-tab="overview" title="文書事務の概況: 全体の流れと現在の状態">文書事務概況</a>
      <a href="#collect" data-tab="collect" title="収受簿: NAS が受け付けた記録の受付台帳(収受番号・受付印・差出端末)・収集除外の設定">収受簿</a>
      <a href="#facts" data-tab="facts" title="現用文書: 生ログ(turns)の検索・フラグと、整理・登載された事実(facts)の編集">現用文書</a>
      <a href="#kessai" data-tab="kessai" title="決裁・後閲: 人間の決裁待ち・差し戻し・後閲待ちの文書一覧と原本、停留所マップ、専決規程(モデルの役割分担)">決裁・後閲</a>
      <a href="#shelf" data-tab="shelf" title="書庫: 完結(施行済・廃案・後閲済)した文書だけを載せる閲覧専用の書庫。原本と回議録">書庫</a>
      <a href="#kanribo" data-tab="kanribo" title="管理簿: 行政文書ファイルの分類・保存期間・満了する日・満了時の措置">管理簿</a>
      <a href="#skills" data-tab="skills" title="編さん段: 繰り返し作業の手順書(スキル)と使用実績">スキル</a>
      <a href="#hooks" data-tab="hooks" title="編さん段: 決まった時点で必ず実行される仕込み(フック)">Hooks</a>
      <a href="#context" data-tab="context" title="例規(常用文書): セッションに注入される例規(index.md)の中身">例規 (常用文書)</a>
      <a href="#routing" data-tab="routing" title="配付先: どの端末にどのプロジェクトの例規(index.md)を注入するか">配付先</a>
      <a href="#messages" data-tab="messages" title="一度きりの事務引継(次セッションで表示されて終わり)">事務引継</a>
      <a href="#usage" data-tab="usage" title="予算執行: Claude Code の使用量(各端末→OTLP→NAS Prometheus のテレメトリ集計)">予算執行</a>
      <a href="#teiso" data-tab="teiso" title="逓送: 夜間便の発着(crontab)・逓送簿(実行履歴)・便リプレイ">逓送</a>
      <a href="#kanri" data-tab="kanri" title="監理: この端末の実接続設定・hookスクリプト・配布リポジトリ(claude-config)">監理</a>
    </nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <main class="stage">
    <header class="topbar">
      <div id="topbarTitle" class="topbar-title"></div>
      <div class="topbar-right">
        <span id="nasStamp" class="stamp"></span>
        <button id="refreshNas" class="btn ghost" title="NASから再取得">NAS更新</button>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
<script src="/static/theme.js"></script>
</body>
</html>
